name: Semgrep

# CodeQL has no PHP (or Perl) analyzer, and this repo's display backend
# (disp/index.php, disp/serveimg.php, disp/transcoder.php) gets no SAST from
# it. CodeQL's JavaScript analyzer alone would still leave the PHP dark, so
# Semgrep covers both: this fills the gap for the whole disp/ tree.
#
# Advisory only for now (Wave 1 baseline) -- uploads full-repo SARIF to the
# Security tab, never fails the check. A diff-aware `semgrep ci` blocking
# gate on new findings (mirroring csl-websanlexicon's Wave 2) is a follow-on,
# not this pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    # The semgrep container ships its own Python; skip on Dependabot (no token).
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/php \
            --config p/javascript \
            --config p/security-audit \
            --sarif --output semgrep.sarif \
            --metrics off || true

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
